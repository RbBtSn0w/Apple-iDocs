name: PR Target
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  validate:
    name: Validate base branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: test "$BASE_REF" = main
