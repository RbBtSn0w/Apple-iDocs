name: Release
run-name: >-
  ${{ inputs.operation == 'recover' && format('Recover release · run {0}', inputs.source_run_id) || github.event_name == 'schedule' && 'Release main · scheduled' || 'Release main · manual' }}

on:
  schedule:
    - cron: "0 15 * * 5"
      timezone: "Asia/Singapore"
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [release, recover]
        default: release
        description: Release current main, or complete an original release
      source_run_id:
        type: string
        description: Original release run ID — required only for recover
      artifact_id:
        type: string
        description: Original recovery artifact ID — copy from Release outcome

permissions:
  actions: read
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CI: 'true'
  TZ: Asia/Singapore

jobs:
  verify:
    name: Analyze and validate candidate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.operation != 'recover'
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      analysis_artifact_id: ${{ steps.analysis_artifact.outputs.artifact-id }}
      source_sha: ${{ github.sha }}
      version: ${{ steps.plan.outputs.version }}
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - name: Check release entrypoint
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          test "$RELEASE_REF" = refs/heads/main
          case "$RELEASE_EVENT" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Check synchronized release implementation
        run: node .github/release-train/sync.mjs check --consumer .
      - name: Install release npm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install frozen release tools
        run: npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Install the cadence parser
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-cadence
        run: npm install --prefix "$RELEASE_TOOLS" --ignore-scripts --no-audit --no-fund --save-exact yaml@2.9.1
      - name: Check release behavior
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-cadence
        run: |
          node --test scripts/release/*.test.mjs
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check release pipeline and configured schedule
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-cadence
        run: |
          node .github/release-train/pipeline-contract.mjs check
          node .github/release-train/cadence.mjs check

      - name: Analyze candidate with upstream engine, without service credentials
        id: plan
        run: |
          mkdir release-input
          node .github/release-train/cli.mjs analyze --directory release-input
      - uses: ./.github/actions/setup-tuist
        if: steps.plan.outputs.needed == 'true'
      - name: Build and test exact candidate
        if: steps.plan.outputs.needed == 'true'
        env:
          RELEASE_TOOLS: ${{ runner.temp }}/release-cadence
          IDOCS_DERIVED_DATA_PATH: ${{ runner.temp }}/idocs-verification
        run: |
          ./scripts/tuist-silent.sh build iDocs
          ./scripts/tuist-silent.sh test
          bash scripts/test-publish-homebrew-formula.sh
          bash scripts/test-release-config.sh
      - name: Build final native archive and wrapper once
        if: steps.plan.outputs.needed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          IDOCS_RELEASE_DERIVED_DATA: ${{ runner.temp }}/idocs-release
          IDOCS_RELEASE_BUILD_LOG: ${{ runner.temp }}/idocs-release-build.log
        run: |
          ./scripts/release-package.sh "$RELEASE_VERSION" "$PWD/release-input"
          mkdir -p "$RUNNER_TEMP/idocs-wrapper"
          cp -R npm/. "$RUNNER_TEMP/idocs-wrapper/"
          rm -rf "$RUNNER_TEMP/idocs-wrapper/node_modules" "$RUNNER_TEMP/idocs-wrapper/dist"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP+"/idocs-wrapper/package.json",v=process.env.RELEASE_VERSION,j=JSON.parse(fs.readFileSync(p));j.version=v;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
          npm pack "$RUNNER_TEMP/idocs-wrapper" --ignore-scripts --json --pack-destination "$PWD/release-input" > "$RUNNER_TEMP/idocs-pack.json"
          node .github/release-train/npm-pack.mjs "$RUNNER_TEMP/idocs-pack.json" "$RUNNER_TEMP/idocs-wrapper/package.json" release-input/package.tgz
          scripts/release/node_modules/.bin/publint release-input/package.tgz --strict
          node scripts/release/verify-package.mjs "$PWD/release-input/package.tgz" "$PWD/release-input/idocs-darwin-arm64.tar.gz" "$RELEASE_VERSION"
          node .github/release-train/cli.mjs seal --directory release-input
      - name: Hand off this run's verified payload
        id: artifact
        if: steps.plan.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-idocs-${{ github.sha }}-${{ github.run_attempt }}
          path: release-input/
          if-no-files-found: error
          retention-days: 30

      - name: Retain read-only analysis
        id: analysis_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-analysis-${{ github.run_attempt }}
          path: release-input/plan.json
          if-no-files-found: warn
  recovery-input:
    name: Validate original recovery identity
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'recover'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.candidate_sha }}
      version: ${{ steps.plan.outputs.version }}
      artifact_id: ${{ inputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check synchronized recovery implementation
        run: node .github/release-train/sync.mjs check --consumer .
      - name: Bind original run and immutable artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/source-artifact.json"
          node .github/release-train/recovery-source.mjs --run "$RUNNER_TEMP/source-run.json" --artifact "$RUNNER_TEMP/source-artifact.json" --repository "$GITHUB_REPOSITORY" --source-run-id "$SOURCE_RUN_ID" --artifact-id "$ARTIFACT_ID" > "$RUNNER_TEMP/recovery-source.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/source-artifact.zip"
          node --input-type=module -e 'import {readFileSync} from "node:fs";import {createHash} from "node:crypto";const p=process.env.RUNNER_TEMP,m=JSON.parse(readFileSync(p+"/source-artifact.json"));if(!new RegExp("^(verified-idocs|idocs-publication)-"+JSON.parse(readFileSync(p+"/source-run.json")).head_sha+"-[1-9][0-9]*$").test(m.name)||m.digest!=="sha256:"+createHash("sha256").update(readFileSync(p+"/source-artifact.zip")).digest("hex"))throw Error("Original verified artifact name/digest mismatch")'
          python3 scripts/release/check_artifact_zip.py "$RUNNER_TEMP/source-artifact.zip"
          node -e 'const fs=require("fs"),s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/recovery-source.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"candidate_sha="+s.candidate_sha+"\n")'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: verified
      - name: Install release npm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate original sealed plan and existing tag
        id: plan
        env:
          CANDIDATE: ${{ steps.source.outputs.candidate_sha }}
        run: |
          npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
          node --input-type=module -e 'import {recoveryPlan} from "./scripts/release/release.mjs"; import {appendFileSync} from "node:fs"; const p=recoveryPlan("verified",process.env.CANDIDATE); appendFileSync(process.env.GITHUB_OUTPUT,"version="+p.next.version+"\n")'
          python3 -c 'import os; from scripts.release.recovery import verify_tag; import json; from pathlib import Path; p=json.loads(Path("verified/plan.json").read_text()); verify_tag("RbBtSn0w/Apple-iDocs",p["next"]["gitTag"],os.environ["CANDIDATE"])'

  release:
    name: Publish native archive and registries
    needs: [verify, recovery-input]
    if: always() && vars.RELEASE_ENABLED == 'true' && ((needs.verify.result == 'success' && needs.verify.outputs.needed == 'true') || needs.recovery-input.result == 'success')
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.recovery_finalize.outputs.version || steps.publish.outputs.version }}
      released: ${{ steps.recovery_finalize.outputs.released || steps.publish.outputs.released }}
      native_sha256: ${{ steps.recovery_finalize.outputs.native_sha256 || steps.publish.outputs.native_sha256 }}
      source_sha: ${{ needs.recovery-input.outputs.source_sha || needs.verify.outputs.source_sha }}
      publication_artifact_id: ${{ steps.publication_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release npm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install frozen tools without lifecycle hooks
        run: npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.recovery-input.outputs.artifact_id || needs.verify.outputs.artifact_id }}
          run-id: ${{ inputs.operation == 'recover' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: release-input
          merge-multiple: true
      - name: Publish verified candidate
        id: publish
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          OPERATION: ${{ inputs.operation }}
          RECOVERY_CANDIDATE: ${{ needs.recovery-input.outputs.source_sha }}
        run: |
          # shellcheck disable=SC2016
          printf '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}\n' > "$RUNNER_TEMP/idocs-publish.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/idocs-publish.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          if [ "$OPERATION" = recover ]; then
            RECOVERY_PHASE=prepare node .github/release-train/cli.mjs recover --directory "$PWD/release-input"
          else
            node .github/release-train/cli.mjs publish --directory "$PWD/release-input"
          fi
      - name: Preflight recovery npm
        id: recovery_preflight_npm
        if: inputs.operation == 'recover'
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECOVERY_CANDIDATE: ${{ needs.recovery-input.outputs.source_sha }}
          RECOVERY_PHASE: preflight
          RECOVERY_TARGET: npm
        run: node .github/release-train/cli.mjs recover --directory "$PWD/release-input"
      - name: Preserve immutable npm request intent
        id: recovery_intent_npm
        if: inputs.operation == 'recover' && steps.recovery_preflight_npm.outputs.request_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-recovery-intent-${{ inputs.source_run_id }}-npm
          path: release-input/plan.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish or observe recovery npm
        if: inputs.operation == 'recover'
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECOVERY_CANDIDATE: ${{ needs.recovery-input.outputs.source_sha }}
          RECOVERY_PHASE: registry
          RECOVERY_TARGET: npm
          RECOVERY_INTENT_ARTIFACT_ID: ${{ steps.recovery_intent_npm.outputs.artifact-id }}
        run: node .github/release-train/cli.mjs recover --directory "$PWD/release-input"
      - name: Preflight recovery github-packages
        id: recovery_preflight_github_packages
        if: inputs.operation == 'recover'
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECOVERY_CANDIDATE: ${{ needs.recovery-input.outputs.source_sha }}
          RECOVERY_PHASE: preflight
          RECOVERY_TARGET: github-packages
        run: node .github/release-train/cli.mjs recover --directory "$PWD/release-input"
      - name: Preserve immutable github-packages request intent
        id: recovery_intent_github_packages
        if: inputs.operation == 'recover' && steps.recovery_preflight_github_packages.outputs.request_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-recovery-intent-${{ inputs.source_run_id }}-github-packages
          path: release-input/plan.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish or observe recovery github-packages
        if: inputs.operation == 'recover'
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECOVERY_CANDIDATE: ${{ needs.recovery-input.outputs.source_sha }}
          RECOVERY_PHASE: registry
          RECOVERY_TARGET: github-packages
          RECOVERY_INTENT_ARTIFACT_ID: ${{ steps.recovery_intent_github_packages.outputs.artifact-id }}
        run: node .github/release-train/cli.mjs recover --directory "$PWD/release-input"
      - name: Finalize verified recovery targets
        id: recovery_finalize
        if: inputs.operation == 'recover'
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECOVERY_CANDIDATE: ${{ needs.recovery-input.outputs.source_sha }}
          RECOVERY_PHASE: finalize
        run: node .github/release-train/cli.mjs recover --directory "$PWD/release-input"
      - name: Retain independent target receipts, including partial failures
        id: publication_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idocs-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: release-input/
          if-no-files-found: warn
          retention-days: 90

  publish-homebrew:
    name: Publish Homebrew
    needs: release
    outputs:
      receipt_artifact_id: ${{ steps.homebrew_receipt.outputs.artifact-id }}
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.released == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Generate Homebrew tap token
        id: homebrew-tap-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: RbBtSn0w
          repositories: homebrew-tap
          permission-contents: write
      - name: Publish Homebrew formula
        id: publish_formula
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          HOMEBREW_TAP_REPOSITORY: RbBtSn0w/homebrew-tap
          HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-tap-token.outputs.token }}
        run: ./scripts/publish-homebrew-formula.sh "$RELEASE_VERSION"
      - name: Read back published Homebrew identity
        if: always() && steps.publish_formula.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.homebrew-tap-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_CANDIDATE: ${{ needs.release.outputs.source_sha }}
          RELEASE_NATIVE_SHA256: ${{ needs.release.outputs.native_sha256 }}
          HOMEBREW_TAP_REPOSITORY: RbBtSn0w/homebrew-tap
        run: node scripts/release/observe-homebrew.mjs
      - name: Preserve Homebrew readback receipt
        id: homebrew_receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-receipt-${{ github.run_attempt }}
          path: homebrew-receipt.json
          if-no-files-found: ignore

  result:
    name: Release outcome
    needs: ['verify', 'recovery-input', 'release', 'publish-homebrew']
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Restore plan for result context
        id: analysis_plan
        continue-on-error: true
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.analysis_artifact_id }}
          merge-multiple: true
          path: result-input
      - name: Restore original recovery plan
        id: original_plan
        continue-on-error: true
        if: needs.recovery-input.result == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: result-input
      - name: Restore independent publication receipts
        id: publication_receipts
        if: always() && needs.release.outputs.publication_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.publication_artifact_id }}
          merge-multiple: true
          path: publication-input
      - name: Restore Homebrew readback receipt
        id: homebrew_receipts
        if: always() && needs.publish-homebrew.outputs.receipt_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-homebrew.outputs.receipt_artifact_id }}
          merge-multiple: true
          path: publication-input
      - name: Read back GitHub assets and original recovery identity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          ORIGINAL_RUN_ID: ${{ inputs.operation == 'recover' && inputs.source_run_id || github.run_id }}
          RECOVERY_ARTIFACT_ID: ${{ needs.recovery-input.outputs.artifact_id || needs.release.outputs.publication_artifact_id }}
        run: node scripts/release/observe-platforms.mjs
      - name: Record independent verification and publication results
        if: always()
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          REPORT_DOWNLOADS: '{"analysis":"${{ steps.analysis_plan.outcome }}","original":"${{ steps.original_plan.outcome }}","publication":"${{ steps.publication_receipts.outcome }}","homebrew":"${{ steps.homebrew_receipts.outcome }}"}'
          RELEASE_TARGETS: '{"github": "release", "npm": "release", "github-packages": "release", "homebrew": "publish-homebrew"}'
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: node .github/release-train/cli.mjs report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-result-${{ github.run_attempt }}
          path: release-result.json
          if-no-files-found: error
