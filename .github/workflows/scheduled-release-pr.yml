name: Scheduled Release PR

on:
  schedule:
    # Every Friday at 15:00 Beijing time (UTC+8) -> 07:00 UTC
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Open and Auto-Merge Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-bot token
        id: bot
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create or Update Promotion PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_CUSTOM_TOKEN: ${{ steps.bot.outputs.token != '' || secrets.SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail

          if [ "${HAS_CUSTOM_TOKEN}" != "true" ]; then
            echo "::warning::Neither release-bot App nor SYNC_TOKEN was available; falling back to default GITHUB_TOKEN. Note that pull requests opened with GITHUB_TOKEN do not automatically trigger CI workflow runs under GitHub's default security policy."
          fi

          git fetch --quiet origin main develop

          ahead="$(git rev-list --count origin/main..origin/develop)"
          if [ "$ahead" -eq 0 ]; then
            echo "develop has no new commits ahead of main; nothing to release."
            exit 0
          fi

          echo "develop is ${ahead} commit(s) ahead of main."

          # A `Fixes #NNN` in a feature PR only auto-closes when *that* PR merges into the
          # default branch. Feature PRs merge into develop, so the keyword does nothing there;
          # restate it here so the issue closes when this promotion PR reaches main.
          closing_refs=""
          for sha in $(git rev-list origin/main..origin/develop); do
            pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              --jq '.[0].number' 2>/dev/null || true)"
            [ -n "$pr_number" ] || continue
            body="$(gh pr view "$pr_number" --json body --jq '.body' 2>/dev/null || true)"
            refs="$(printf '%s' "$body" \
              | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+([[:space:],]+#[0-9]+)*' \
              | grep -Eo '#[0-9]+' || true)"
            closing_refs="${closing_refs}${refs}"$'\n'
          done
          closing_refs="$(printf '%s' "$closing_refs" | grep -Eo '#[0-9]+' | sort -u -t'#' -k2 -n)"

          body=$'### 📦 Scheduled Stable Release\n\nAutomated weekly release promotion from `develop` to `main`.\n\n- Auto-merge is enabled.\n- Once CI passes and checks are green, GitHub will automatically merge this PR.\n- Merging into `main` triggers stable release publishing.'
          if [ -n "${closing_refs}" ]; then
            body="${body}"$'\n\n'"$(printf '%s\n' "${closing_refs}" | sed 's/^/Closes /')"
          fi

          # Look for existing open PR from develop to main
          pr="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "$pr" ]; then
            echo "Creating release promotion PR (develop -> main)..."
            gh pr create --base main --head develop \
              --title "chore(release): promote develop to stable" \
              --body "${body}"
            pr="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
          else
            echo "Refreshing promotion PR #${pr} body in case new commits queued up..."
            gh pr edit "$pr" --body "${body}"
          fi

          echo "Release PR #${pr} ready."

          # Enable native GitHub auto-merge (idempotent if already enabled on existing PR)
          echo "Enabling auto-merge on PR #${pr}..."
          if ! gh pr merge "$pr" --auto --merge 2>&1 | tee /tmp/merge.log; then
            if grep -Eqi "already|pull request is already" /tmp/merge.log; then
              echo "Auto-merge already active on PR #${pr}."
            else
              echo "Failed to enable auto-merge on PR #${pr}." >&2
              exit 1
            fi
          fi
          echo "Auto-merge configured for PR #${pr}."
