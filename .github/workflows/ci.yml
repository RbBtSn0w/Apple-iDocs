name: iDocs CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDOCS_DERIVED_DATA_PATH: ${{ github.workspace }}/.deriveddata

jobs:
  build-and-test:
    timeout-minutes: 30
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Tuist
        uses: ./.github/actions/setup-tuist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Use npm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify benchmark version metadata
        run: node --test scripts/benchmark/tests/install-corrival-releases.test.mjs

      - name: Install frozen release tools
        run: npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund

      - name: Check the actual release contract
        id: release_contracts
        env:
          RELEASE_TOOLS: ${{ github.workspace }}/scripts/release
        run: |
          node --version
          npm --version
          node .github/release-train/sync.mjs check --consumer .
          node .github/release-train/pipeline-contract.mjs check
          node .github/release-train/cadence.mjs check

      - name: Verify release configuration
        env:
          RELEASE_TOOLS: ${{ github.workspace }}/scripts/release
        run: bash ./scripts/test-release-config.sh

      - name: Build CLI
        run: ./scripts/tuist-silent.sh build iDocs

      - name: Verify Binary
        run: |
          ls -l "$IDOCS_DERIVED_DATA_PATH/Build/Products/Debug/idocs"
          file "$IDOCS_DERIVED_DATA_PATH/Build/Products/Debug/idocs"

      - name: Run Default Test Suite
        run: ./scripts/tuist-silent.sh test
        env:
          IDOCS_LOCAL_BINARY: ${{ env.IDOCS_DERIVED_DATA_PATH }}/Build/Products/Debug/idocs
          IDOCS_PROJECT_ROOT: ${{ github.workspace }}
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Verify Homebrew publish script
        run: bash ./scripts/test-publish-homebrew-formula.sh


  e2e-cli-offline:
    timeout-minutes: 30
    runs-on: macos-26
    env:
      IDOCS_LOCAL_BINARY: ${{ github.workspace }}/.deriveddata/Build/Products/Debug/idocs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Tuist
        uses: ./.github/actions/setup-tuist

      - name: Build CLI for E2E
        run: ./scripts/tuist-silent.sh build iDocs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: 'npm'
          cache-dependency-path: npm/package-lock.json

      - name: Use npm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies for npm wrapper
        run: npm --prefix npm ci --no-audit --no-fund

      - name: Run iDocs CLI E2E (offline deterministic gate)
        run: IDOCS_NPM_STRICT_INSTALL=1 ./scripts/e2e-cli.sh offline

  pr-preview:
    name: iDocs PR preview package
    if: github.event_name == 'pull_request'
    needs: [build-and-test, e2e-cli-offline]
    runs-on: macos-26
    timeout-minutes: 35
    outputs:
      receipt: ${{ steps.pack.outputs.receipt }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tuist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: Use npm 12
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build the exact PR head and install its preview archive
        id: pack
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          IDOCS_RELEASE_DERIVED_DATA: ${{ runner.temp }}/idocs-preview-derived
          IDOCS_RELEASE_BUILD_LOG: ${{ runner.temp }}/idocs-preview-build.log
        run: |
          test "$(uname -m)" = arm64
          node .github/pr-preview/artifact.mjs build "$RUNNER_TEMP/idocs-preview"
      - name: Upload verified preview
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idocs-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/idocs-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize the verified preview
        env:
          RECEIPT: ${{ steps.pack.outputs.receipt }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          node --input-type=module -e '
            import {renderCard} from "./.github/pr-preview/github.mjs";
            const {GITHUB_REPOSITORY: repository, GITHUB_SERVER_URL: server, RECEIPT, ARTIFACT_ID: artifact} = process.env;
            console.log(renderCard({repository, server, receipt: JSON.parse(RECEIPT), artifact}));
          ' >> "$GITHUB_STEP_SUMMARY"

  pr-preview-comment:
    name: Announce iDocs PR preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: pr-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: idocs-pr-preview-card-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RECEIPT: ${{ needs.pr-preview.outputs.receipt }}
          ARTIFACT_ID: ${{ needs.pr-preview.outputs.artifact }}
        with:
          script: |
            const {renderCard, updateCard} = await import(`${process.env.GITHUB_WORKSPACE}/.github/pr-preview/github.mjs`);
            const {GITHUB_REPOSITORY: repository, GITHUB_SERVER_URL: server, RECEIPT, ARTIFACT_ID: artifact} = process.env;
            const receipt = JSON.parse(RECEIPT);
            const {number: pr, head} = context.payload.pull_request;
            if (String(pr) !== receipt.pr || head.sha !== receipt.head || String(context.runId) !== receipt.run || !/^[1-9]\d*$/.test(artifact)) {
              throw new Error('The preview artifact does not belong to this pull request and run.');
            }
            const body = renderCard({repository, server, receipt, artifact});
            core.notice(await updateCard(github, {...context.repo, pr, head: head.sha, body}));
